<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearthvale</title>
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/menus.css">
<link rel="stylesheet" href="css/play.css">
</head>
<body>
<canvas id="c" aria-label="Hearthvale village map"></canvas>
<header id="topbar">
  <div id="hud" role="button" tabindex="0" aria-label="Village stores"></div>
  <div id="clockpill"><button id="pausebtn" aria-label="Pause"></button><button id="speedbtn" aria-label="Game speed"></button></div>
</header>
<nav id="tabbar" aria-label="Menus">
  <button data-tab="build" aria-label="Build"></button><button data-tab="village" aria-label="Village"></button>
  <button data-tab="book" aria-label="Book"></button><button data-tab="game" aria-label="Game"></button>
</nav>
<div id="dir" hidden></div>
<div id="tip" hidden></div>
<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
