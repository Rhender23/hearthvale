<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearthvale</title>
<style>
:root{
  --bg:#cfe3d4; --ink:#4a3b2a; --bar:rgba(255,247,230,.92); --line:#d9c7a3; --on:#e9d6ad; --glow:#f2c14e;
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b2b;--ink:#f1e6cf;--bar:rgba(43,58,58,.92);--line:#4a5c5c;--on:#55706e}}
:root[data-theme="dark"]{--bg:#1d2b2b;--ink:#f1e6cf;--bar:rgba(43,58,58,.92);--line:#4a5c5c;--on:#55706e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
[hidden]{display:none!important}
.chip,#hud,#tip,#toast,#hint,.pop,.sheet,#say{background:var(--bar);border:2px solid var(--line);color:var(--ink)}

#hudbtn,#fab{position:fixed;z-index:5;border-radius:50%;background:var(--bar);border:2px solid var(--line)}
#hudbtn{left:12px;top:calc(8px + var(--sa-t));width:42px;height:42px;font-size:20px}
#fab{left:12px;bottom:calc(12px + var(--sa-b));width:54px;height:54px;font-size:26px}
#fab.on{background:var(--on)}
#hud{position:fixed;z-index:5;left:62px;top:calc(8px + var(--sa-t));max-width:calc(100vw - 74px);display:flex;flex-wrap:wrap;gap:2px 12px;padding:6px 12px;border-radius:14px;font-size:14px;line-height:1.5}
#hud b{font-variant-numeric:tabular-nums}
#hud .grp{flex-basis:100%;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;line-height:1.2;margin-top:2px}
#hud .grp.sub{text-transform:none;letter-spacing:0;opacity:.85;font-size:12px;margin-top:-2px}
#hud [hidden]{display:none}
#hud.simple .adv{display:none!important}
#hud small{font-size:11px;margin-left:3px;font-variant-numeric:tabular-nums}
#hud small.pos{color:#4f8a3a}
#hud small.neg{color:#b5523d}
#dir{position:fixed;z-index:5;right:12px;top:calc(58px + var(--sa-t));width:min(76vw,320px);max-height:52vh;overflow:auto;padding:8px 10px;border-radius:14px;font-size:12px;display:flex;flex-direction:column;gap:6px;background:var(--bar);border:2px solid var(--line)}
#dir .dirbox{display:flex;flex-direction:column;gap:1px}
#dir .dn{font-weight:700;font-size:13px}
#dir .wl{font-variant-numeric:tabular-nums}
#dir .dem{font-style:italic}

.volrow{display:flex;align-items:center;gap:10px;font-size:13px}
.volrow input{flex:1;min-width:120px;accent-color:var(--glow)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.lbl{min-width:36px;font-size:13px}
button.ic{width:44px;height:44px;border-radius:50%;padding:0;font-size:21px;border:2px solid var(--line);background:var(--bar);white-space:nowrap}
button.ic.on{background:var(--on)}
button.ic.ready{box-shadow:0 0 0 3px var(--glow)}
button:disabled{opacity:.42;cursor:default}

#hud [data-tip]{cursor:help}
button.card,button.wide{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:transparent;font-size:14px}
button.card small,button.wide small{font-size:12px;opacity:.85}

#tip{position:fixed;z-index:9;max-width:240px;padding:8px 10px;border-radius:12px;font-size:13px;line-height:1.4;pointer-events:none;display:flex;flex-direction:column;gap:2px}
#toast{position:fixed;z-index:8;left:50%;top:calc(58px + var(--sa-t));transform:translate(-50%,-6px);max-width:min(92vw,460px);padding:8px 16px;border-radius:16px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.hud-open #toast{top:calc(118px + var(--sa-t))}
body.hud-open #dir{top:calc(150px + var(--sa-t));max-height:44vh}
#dir{top:calc(58px + var(--sa-t))}
#hint{position:fixed;z-index:4;left:50%;top:calc(62px + var(--sa-t));transform:translateX(-50%);max-width:min(88vw,420px);padding:8px 14px;border-radius:14px;font-size:13px;text-align:center;transition:opacity .8s}
#hint.gone{opacity:0;pointer-events:none}

#nm{position:fixed;inset:0;z-index:20;background:rgba(20,30,30,.45);display:flex;align-items:center;justify-content:center}
#nm .dlg{background:var(--bar);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;width:min(86vw,300px)}
#nm input{font:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);user-select:text;-webkit-user-select:text}
#nm button{padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bar)}
#inside{position:fixed;inset:0;z-index:20;background:rgba(20,30,30,.5);display:flex;align-items:center;justify-content:center}
#inside .dlg{background:var(--bar);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 24px)}
#inside canvas{border-radius:12px;border:2px solid var(--line)}
#inside .cap{font-size:13px;opacity:.9;line-height:1.4}
#inside .deco{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow:auto}
#inside .close{align-self:flex-end;padding:6px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bar)}
@media (prefers-reduced-motion:reduce){#toast,#hint{transition:none}}
/* ---- bubble buttons with captions ---- */
.bw{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
.bw small{font-size:11px;line-height:1.15;text-align:center;opacity:.85;max-width:56px}
.prow.wrap{gap:8px 4px}
/* ---- Build: always one tap away, bottom right where the thumb rests ---- */
#buildbtn{position:fixed;z-index:5;right:16px;bottom:calc(16px + var(--sa-b));width:62px;height:62px;border-radius:50%;font-size:28px;background:var(--bar);border:2px solid var(--line);box-shadow:0 4px 14px rgba(40,30,20,.18)}
#buildbtn.on{background:var(--on)}
/* ---- first-steps hints ---- */
#coach{position:fixed;z-index:9;max-width:min(92vw,420px);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--bar);border:2px solid var(--glow);color:var(--ink);font-size:15px;line-height:1.35;box-shadow:0 6px 18px rgba(40,30,20,.2)}
#coach .co-i{font-size:20px}
#coach .co-t{flex:1}
#coach .co-skip{flex:0 0 auto;min-height:36px;padding:0 10px;border-radius:12px;border:2px solid var(--line);background:transparent;font-size:12px}
#ring{position:fixed;z-index:8;border-radius:50%;border:3px solid var(--glow);pointer-events:none;animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.15);opacity:.5}}
/* ---- looking inside ---- */
#inside .dlg{max-height:calc(100vh - 24px);overflow:auto;width:min(600px,calc(100vw - 16px))}
#inside .in-head{position:relative;display:flex;align-items:center;min-height:44px;padding-right:48px}
#inside .in-head .sh-x{top:0;right:0}
#inside canvas{align-self:center;touch-action:none}
#inside .in-tools{display:flex;flex-direction:column;gap:8px}
#inside .in-msg{opacity:.85;font-size:13px}
@media (prefers-reduced-motion:reduce){#ring{animation:none}}

/* ---- bubble menu (opens at what was tapped) ---- */
.pop{position:fixed;z-index:7;border-radius:18px;padding:10px 12px;max-width:min(360px,calc(100vw - 20px));box-shadow:0 6px 20px rgba(40,30,20,.18);font-size:14px}
.pop.in{animation:popin .16s ease-out}
@keyframes popin{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.pop-arrow{position:absolute;bottom:-9px;width:16px;height:16px;margin-left:-8px;background:var(--bar);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.pop.below .pop-arrow{bottom:auto;top:-9px;transform:rotate(225deg)}
.pop-body{display:flex;flex-direction:column;gap:8px}
.pop-head{display:flex;flex-direction:column;gap:1px;min-width:0}
.pop-head .pt{font-size:15px}
.pop-head small{font-size:13px;line-height:1.35;opacity:.88}
.pop-head .ps2{opacity:.7;font-size:12px}
.prow{display:flex;gap:8px;align-items:center}
.prow.wrap{flex-wrap:wrap}
.more-row{padding-top:8px;border-top:1px dashed var(--line)}
.pop-q{display:flex;flex-direction:column;gap:2px;max-width:280px}
.pop-q small{font-size:13px;opacity:.85}
.pop-yn{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
button.pbtn{min-height:44px;min-width:44px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--bar);font-size:15px}
button.pbtn.primary{background:#7fae6a;border-color:#5f8f4e;color:#fff}
button.pbtn.danger{background:#c9624c;border-color:#a94c39;color:#fff}
button.ic.more{font-size:15px;letter-spacing:-1px}
button.ic.sm{width:36px;height:36px;font-size:18px}
/* ---- bottom sheet (lists) ---- */
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;height:min(52vh,460px);border-radius:20px 20px 0 0;border-bottom:0;display:flex;flex-direction:column;padding-bottom:var(--sa-b);box-shadow:0 -6px 24px rgba(40,30,20,.16);transition:height .2s}
.sheet.full{height:86vh}
.sheet.in{animation:sheetin .2s ease-out}
@keyframes sheetin{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.sh-head{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 52px 8px;touch-action:none;cursor:grab}
.sh-handle{position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.sh-title{font-size:16px}
.sh-x{position:absolute;right:8px;top:6px;width:44px;height:44px;border:0;background:transparent;font-size:18px}
.sh-body{flex:1;overflow:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}
button.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:transparent}
button.tab span{font-size:22px}
button.tab small{font-size:11px}
button.tab.on{background:var(--on)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
button.card .cn{font-size:14px}
button.card .cneed{opacity:.7;font-style:italic}
ul.details{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4}
/* iPad and desktop: the sheet floats at the bottom left, the map stays in view */
@media (min-width:900px){.sheet{left:84px;right:auto;bottom:12px;width:440px;max-width:none;border-radius:20px;border-bottom:2px solid var(--line);height:min(60vh,560px)}.sheet.full{height:calc(100vh - 100px)}}
/* ---- short notes at the tap ---- */
#say{position:fixed;z-index:8;padding:8px 14px;border-radius:14px;font-size:14px;line-height:1.35;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;box-shadow:0 4px 14px rgba(40,30,20,.14)}
#say.show{opacity:1;transform:none}
#toast.act{pointer-events:auto;display:flex;gap:12px;align-items:center}
.tbtn{min-height:36px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--on);font-weight:700}
@media (prefers-reduced-motion:reduce){.pop.in,.sheet.in{animation:none}#say{transition:none}.sheet{transition:none}}

</style>
</head>
<body>
<canvas id="c" aria-label="Hearthvale village map"></canvas>
<button id="hudbtn" data-tip="hud" aria-label="Show resources">🎒</button>
<div id="hud" hidden>
  <span>🪵 <b id="r-wood">0</b></span><span>🪨 <b id="r-stone">0</b></span><span>⛏️ <b id="r-gold">0</b></span><span>🍎 <b id="r-food">0</b></span>
  <span>🏠 <b id="r-pop">0</b></span><span id="r-age"></span>
</div>
<button id="fab" aria-label="Game menu">🏡</button>
<button id="buildbtn" aria-label="Build" data-tip="build">🔨</button>
<div id="dir" hidden></div>
<div id="tip" hidden></div>
<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>

</body></html>
